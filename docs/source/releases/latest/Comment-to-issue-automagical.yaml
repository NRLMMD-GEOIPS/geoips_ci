continuous integration:
- title: 'Add GitHub Action for Automated Issue Creation from PR Comments'
  description: >
    Implemented a new GitHub Actions workflow
    triggered by PR review comments. This action parses comments for a specific trigger phrase
    ("please open an issue") and, if found, creates a GitHub issue and links it back
    to the comment and PR.
  files:
    added:
    - '.github/workflows/.github/.github/workflows/reusable-create-issue-from-comment.yaml'
    - '.github/workflows/.github/.github/workflows/ruleset-create-issue-from-comment.yaml'
  related-issue:
    number: null
    repo_url: ''
  date:
    start: null
    finish: null
