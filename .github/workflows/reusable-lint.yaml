# Lint Check Workflow
#
# This workflow runs various linting tools on the repository to ensure code quality
# and adherence to coding standards. It supports configurable linting options
# through GitHub variables and can be triggered on pull requests or called manually.
#
# Supported linters:
# - Black (code formatting)
# - Doc8 (documentation formatting)
# - Flake8 (code style and quality)
# - Bandit (security vulnerability scanning)
#
# The workflow dynamically enables/disables linters based on repository configuration.

name: Run linters  # Workflow name

on:
  pull_request: 
  workflow_call: 
    secrets:
      token:
        required: true  # Require authentication token

defaults:
  run:
    shell: bash

jobs:
  # Job to determine which linters should be run based on repository configuration
  get-job-flags:
    runs-on: ${{ vars.RUNNER }}  # Use runner specified in repo/org variables
    outputs:
      # Output flags for each linter to be used in subsequent jobs
      CI_LINT_BANDIT: ${{ steps.get_job_flags.outputs.CI_LINT_BANDIT }}
      CI_LINT_DOC8: ${{ steps.get_job_flags.outputs.CI_LINT_DOC8 }}
      CI_LINT_FLAKE8: ${{ steps.get_job_flags.outputs.CI_LINT_FLAKE8 }}
      CI_LINT_BLACK: ${{ steps.get_job_flags.outputs.CI_LINT_BLACK }}
    steps:
      - name: Get job flags  # Step to determine linter flags
        id: get_job_flags
        run: |
          # Array of linter flags to check
          flags=(CI_LINT_BANDIT CI_LINT_DOC8 CI_LINT_FLAKE8 CI_LINT_BLACK)
          for flag in "${flags[@]}"; do
              # Determine flag value based on repository variables
              case $flag in
                  CI_LINT_BANDIT) val="${{ vars.CI_LINT_BANDIT }}" ;;
                  CI_LINT_DOC8) val="${{ vars.CI_LINT_DOC8 }}" ;;
                  CI_LINT_FLAKE8) val="${{ vars.CI_LINT_FLAKE8 }}" ;;
                  CI_LINT_BLACK) val="${{ vars.CI_LINT_BLACK }}" ;;
              esac
              # Set output to true/false based on variable value
              if [ "$val" == "false" ]; then
                  echo "${flag}=false"
                  echo "${flag}=false" >> $GITHUB_OUTPUT
              else
                  echo "${flag}=true"
                  echo "${flag}=true" >> $GITHUB_OUTPUT
              fi
          done

  # Job to print configuration variables (for debugging)
  print-variables:
    name: Print variables
    needs: [get-job-flags]
    uses: NRLMMD-GEOIPS/geoips_ci/.github/workflows/reusable-print-variables.yaml@main
    with:
      # Pass linter flags to print-variables workflow
      CI_LINT_BANDIT: ${{ needs.get-job-flags.outputs.CI_LINT_BANDIT }}
      CI_LINT_DOC8: ${{ needs.get-job-flags.outputs.CI_LINT_DOC8 }}
      CI_LINT_FLAKE8: ${{ needs.get-job-flags.outputs.CI_LINT_FLAKE8 }}
      CI_LINT_BLACK: ${{ needs.get-job-flags.outputs.CI_LINT_BLACK }}

  black-lint:
    runs-on: ${{ vars.RUNNER }}
    needs: [get-job-flags, print-variables]
    if: ${{ needs.get-job-flags.outputs.CI_LINT_BLACK == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checkout geoips default branch
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GEOIPS_ORGANIZATION }}/geoips
          ref: ${{ vars.GEOIPS_DEFAULT_BRANCH }}
          path: ./geoips_repo_default_branch
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "pypy-3.10"
          check-latest: true
      - name: Install black
        run: pip install black
      - name: Run black
        run: |
          black --version
          ./geoips_repo_default_branch/tests/utils/check_code.sh black .
      - name: Save linting results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: black-lint-results
          path: black-lint-results.txt
          retention-days: 1

  doc8-lint:
    runs-on: ${{ vars.RUNNER }}
    needs: [get-job-flags, print-variables]
    if: ${{ needs.get-job-flags.outputs.CI_LINT_DOC8 == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "pypy-3.10"
          check-latest: true
      - name: Install doc8
        run: pip install doc8
      - name: Run doc8
        run: |
          if [ -d "./docs/source/new-docs" ]; then
            doc8 --max-line-length=120 ./docs/source/new-docs/
          else
            echo "No new-docs directory found"
            exit 0
          fi
      - name: Save linting results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc8-lint-results
          path: doc8-lint-results.txt
          retention-days: 1

  flake8-lint:
    runs-on: ${{ vars.RUNNER }}
    needs: [get-job-flags, print-variables]
    if: ${{ needs.get-job-flags.outputs.CI_LINT_FLAKE8 == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checkout geoips default branch
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GEOIPS_ORGANIZATION }}/geoips
          ref: ${{ vars.GEOIPS_DEFAULT_BRANCH }}
          path: ./geoips_repo_default_branch
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "pypy-3.10"
          check-latest: true
      - name: Install flake8 and plugins
        run: |
          pip install flake8 flake8-docstrings flake8-rst-docstrings
      - name: Run flake8
        run: |
          ./geoips_repo_default_branch/tests/utils/check_code.sh flake8 .
      - name: Save linting results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake8-lint-results
          path: flake8-lint-results.txt
          retention-days: 1

  bandit-lint:
    runs-on: ${{ vars.RUNNER }}
    needs: [get-job-flags, print-variables]
    if: ${{ needs.get-job-flags.outputs.CI_LINT_BANDIT == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checkout geoips default branch
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GEOIPS_ORGANIZATION }}/geoips
          ref: ${{ vars.GEOIPS_DEFAULT_BRANCH }}
          path: ./geoips_repo_default_branch
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "pypy-3.10"
          check-latest: true
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit
        run: |
          ./geoips_repo_default_branch/tests/utils/check_code.sh bandit .
      - name: Save linting results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-lint-results
          path: bandit-lint-results.txt
          retention-days: 1
