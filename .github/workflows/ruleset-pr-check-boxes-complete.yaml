name: Check Boxes Are Checked

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    # Require manually kicking off CI by opening, reopening, or removing draft status.
    # NOTE when used as a repository ruleset, these types are ignored, and
    # opened, reopened, and synchronize are explicitly always enabled.
    types: [opened, ready_for_review, reopened]
jobs:
  pr-is-ready:
    # Only runs if the pull request is NOT a draft
    if: github.event.pull_request.draft == false
    name: PR Is Ready
    # You do not appear to be able to use variables in the "uses" field.
    # Use the full owner/repo path: rulesets run this workflow in the pull
    # request's repository, where ./.github/workflows paths do not exist. Pin a
    # commit SHA of geoips_ci main (CodeQL actions/unpinned-tag rejects @main).
    uses: NRLMMD-GEOIPS/geoips_ci/.github/workflows/reusable-pr-check-boxes-complete.yaml@daa3fcfcae9553f30232f46df2f5b8cabdc788d0 # main
    permissions:
      contents: read
