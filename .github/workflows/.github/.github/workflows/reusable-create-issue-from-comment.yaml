name: Create Issue from PR Review Comment

on:
  pull_request_review_comment:
    types: [created]
  workflow_call:

permissions:
  pull-requests: write # Needed for createReviewComment
  issues: write      # Needed for createIssue

jobs:
  create-issue-from-comment:
    runs-on: ubuntu-latest
    # This 'if' condition is crucial: it ensures the job only runs
    # when the comment contains the trigger phrase.
    if: contains(github.event.comment.body, 'please open an issue')
    steps:
      - name: Create issue with comment thread
        id: create-issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }} # GITHUB_TOKEN is passed by the caller
          script: |
            // Your existing script here...
            // Ensure it handles the case where github.event.comment might not exist
            // if triggered via workflow_call without the right context, though
            // the caller is expected to trigger on pull_request_review_comment.

            if (!context.payload.pull_request || !context.payload.comment) {
              console.log('Missing required payload data (pull_request or comment) for creating an issue.');
              // This return will make the step succeed but with success:false,
              // so the next step won't run due to its 'if' condition.
              // It's important because if this reusable workflow is called
              // from an event that doesn't have this context, it shouldn't fail loudly.
              core.setOutput('result', JSON.stringify({ success: false, error: 'Missing required payload data' }));
              return;
            }

            const prNumber = context.payload.pull_request.number;
            const prTitle = context.payload.pull_request.title;
            const prAuthor = context.payload.pull_request.user.login;
            const commentUrl = context.payload.comment.html_url;
            const commentBody = context.payload.comment.body;
            const commentPath = context.payload.comment.path;
            const commentLine = context.payload.comment.line ||
                               context.payload.comment.original_line ||
                               'Unknown';
            const commentUser = context.payload.comment.user.login;
            const commentId = context.payload.comment.id;

            // Create issue title
            const issueTitle = `[PR #${prNumber}] ${prTitle} - Incomplete Item`;

            let commentThread = '';
            try {
              const allComments = await github.paginate(github.rest.pulls.listReviewComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });

              let relatedComments = [];
              const currentComment = context.payload.comment;

              if (currentComment.in_reply_to_id) {
                const originalComment = allComments.find(c => c.id === currentComment.in_reply_to_id);
                if (originalComment) {
                  relatedComments.push(originalComment);
                  relatedComments = relatedComments.concat(
                    allComments.filter(c => c.in_reply_to_id === originalComment.id)
                  );
                } else {
                  relatedComments.push(currentComment);
                }
              } else {
                relatedComments.push(currentComment);
                relatedComments = relatedComments.concat(
                  allComments.filter(c => c.in_reply_to_id === currentComment.id)
                );
              }

              relatedComments = [...new Map(relatedComments.map(c => [c.id, c])).values()]
                .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

              if (relatedComments.length > 0) {
                commentThread = '### Comment Thread\n\n';
                for (const comment of relatedComments) {
                  const commentHtmlUrl = comment.html_url || commentUrl;
                  const commentUserLogin = comment.user?.login || 'Unknown User';
                  const commentBodyText = comment.body || 'No content';
                  commentThread += `**@${commentUserLogin}** [commented](${commentHtmlUrl}) on \`${comment.path}\`:\n`;
                  commentThread += `> ${commentBodyText.replace(/\n/g, '\n> ')}\n\n`;
                }
              }
            } catch (error) {
              console.log('Error fetching/processing comment thread:', error);
              commentThread = '### Triggering Comment\n\n';
              commentThread += `**@${commentUser}** [commented](${commentUrl}) on \`${commentPath}\`:\n`;
              commentThread += `> ${commentBody.replace(/\n/g, '\n> ')}\n\n`;
            }

            const issueBody = `
            ## Issue created from PR review comment

            This issue was automatically created from a review comment in [PR #${prNumber}](${context.payload.pull_request.html_url}).

            ### Details
            - **File**: \`${commentPath}\`
            - **Line**: ${commentLine}
            - **PR Author**: @${prAuthor}
            - **Comment Author**: @${commentUser}

            ${commentThread}

            [View the original comment](${commentUrl})
            `;

            try {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['incomplete issue'],
                assignees: [prAuthor]
              });

              console.log(`Created issue #${issue.data.number}`);
              core.setOutput('result', JSON.stringify({
                success: true,
                issue_number: issue.data.number,
                issue_url: issue.data.html_url
              }));
            } catch (error) {
              console.error('Error creating issue:', error);
              core.setOutput('result', JSON.stringify({
                success: false,
                error: `Failed to create issue: ${error.message}`
              }));
            }

      - name: Comment on PR review with issue link
        # The output 'result' is a JSON string. We need to parse it.
        # fromJSON is available in GitHub Actions expressions.
        if: fromJSON(steps.create-issue.outputs.result).success
        uses: actions/github-script@v7 # Use a more recent version if available
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const result = ${{ steps.create-issue.outputs.result }}; // This embeds the JSON string as a JS object literal

            if (!result.issue_number || !result.issue_url) {
              console.log('Missing issue information in result, cannot comment on PR.');
              return;
            }

            try {
              await github.rest.pulls.createReviewComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                body: `✅ I've created issue #${result.issue_number} to track this item and assigned it to @${context.payload.pull_request.user.login}. [View the issue](${result.issue_url})`,
                in_reply_to: context.payload.comment.id
              });
              console.log(`Successfully replied to comment ${context.payload.comment.id} in PR #${context.payload.pull_request.number}`);
            } catch (error) {
              console.error('Error replying to PR review comment:', error);
              throw error; // Make the step fail
            }
