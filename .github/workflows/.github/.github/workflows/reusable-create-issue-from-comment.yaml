name: Create Issue from PR Review Comment

on:
  workflow_call:
    secrets:
      GITHUB_TOKEN:
        required: true

permissions:
  pull-requests: write # Needed for createReviewComment
  issues: write      # Needed for createIssue

jobs:
  create-issue-from-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Create issue with comment thread
        id: create-issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }} # GITHUB_TOKEN is passed by the caller
          script: |
            // context.payload.comment and context.payload.pull_request
            // will be populated by the event that triggered the CALLING workflow.

            if (!context.payload.pull_request || !context.payload.comment) {
              core.setFailed('Missing required payload data (pull_request or comment) for creating an issue. This reusable workflow should be called from a pull_request_review_comment event.');
              return;
            }

            const prNumber = context.payload.pull_request.number;
            const prTitle = context.payload.pull_request.title;
            const prAuthor = context.payload.pull_request.user.login;
            const commentUrl = context.payload.comment.html_url;
            const commentBody = context.payload.comment.body; // The original comment body
            const commentPath = context.payload.comment.path;
            const commentLine = context.payload.comment.line ||
                               context.payload.comment.original_line ||
                               'Unknown'; // original_line for multi-line comments
            const commentUser = context.payload.comment.user.login;
            const commentId = context.payload.comment.id;

            const issueTitle = `[PR #${prNumber}] ${prTitle} - Incomplete Item from comment`;

            let commentThread = '';
            try {
              const allComments = await github.paginate(github.rest.pulls.listReviewComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });

              let relatedComments = [];
              const currentComment = context.payload.comment; // The triggering comment

              // Find the root comment of the thread
              let rootComment = currentComment;
              while (rootComment.in_reply_to_id) {
                const parent = allComments.find(c => c.id === rootComment.in_reply_to_id);
                if (parent) {
                  rootComment = parent;
                } else {
                  // Parent not found, break to avoid infinite loop
                  break;
                }
              }

              // Add the root comment
              relatedComments.push(rootComment);

              // Add all comments that reply to the root comment
              // And all comments that reply to the current comment (if it's not the root)
              // This logic can be complex depending on how deep threads you want to capture.

              if (currentComment.in_reply_to_id) {
                const originalComment = allComments.find(c => c.id === currentComment.in_reply_to_id);
                if (originalComment) {
                  relatedComments.push(originalComment); // Add the direct parent
                  // Add siblings (other replies to the same parent)
                  relatedComments = relatedComments.concat(
                    allComments.filter(c => c.in_reply_to_id === originalComment.id)
                  );
                }
                // Always ensure the current comment is included
                if (!relatedComments.find(c => c.id === currentComment.id)) {
                    relatedComments.push(currentComment);
                }
              } else { // Current comment is a top-level comment in a thread
                if (!relatedComments.find(c => c.id === currentComment.id)) {
                    relatedComments.push(currentComment);
                }
                // Add direct replies to the current comment
                relatedComments = relatedComments.concat(
                  allComments.filter(c => c.in_reply_to_id === currentComment.id)
                );
              }


              // Deduplicate and sort
              relatedComments = [...new Map(relatedComments.map(c => [c.id, c])).values()]
                .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));


              if (relatedComments.length > 0) {
                commentThread = '### Comment Thread\n\n';
                for (const comment of relatedComments) {
                  const commentHtmlUrl = comment.html_url || `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${prNumber}#discussion_r${comment.id}`;
                  const commentUserLogin = comment.user?.login || 'Unknown User';
                  const commentBodyText = comment.body || 'No content';
                  commentThread += `**@${commentUserLogin}** [commented](${commentHtmlUrl}) on \`${comment.path}\`:\n`;
                  commentThread += `> ${commentBodyText.replace(/\n/g, '\n> ')}\n\n`;
                }
              }
            } catch (error) {
              console.log('Error fetching/processing comment thread:', error);
              commentThread = '### Triggering Comment\n\n'; 
              commentThread += `**@${commentUser}** [commented](${commentUrl}) on \`${commentPath}\`:\n`;
              commentThread += `> ${commentBody.replace(/\n/g, '\n> ')}\n\n`;
            }

            const issueBody = `
            ## Issue created from PR review comment

            This issue was automatically created from a review comment in [PR #${prNumber}](${context.payload.pull_request.html_url}).

            ### Details
            - **File**: \`${commentPath}\`
            - **Line**: ${commentLine}
            - **PR Author**: @${prAuthor}
            - **Comment Author**: @${commentUser}

            ${commentThread}

            [View the original comment](${commentUrl})
            `;

            try {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['incomplete issue'],
                assignees: [prAuthor]
              });

              console.log(`Created issue #${issue.data.number}`);
              core.setOutput('result', JSON.stringify({
                success: true,
                issue_number: issue.data.number,
                issue_url: issue.data.html_url
              }));
            } catch (error) {
              console.error('Error creating issue:', error);
              core.setFailed(`Failed to create issue: ${error.message}`); // Make the step fail
            }

      - name: Comment on PR review with issue link
        if: fromJSON(steps.create-issue.outputs.result).success && steps.create-issue.outcome == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const result = ${{ steps.create-issue.outputs.result }};

            if (!result.issue_number || !result.issue_url) {
              core.setFailed('Missing issue information in result, cannot comment on PR.');
              return;
            }

            try {
              await github.rest.pulls.createReviewComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                body: `✅ I've created issue #${result.issue_number} to track this item and assigned it to @${context.payload.pull_request.user.login}. [View the issue](${result.issue_url})`,
                in_reply_to: context.payload.comment.id // Reply to the original comment
              });
              console.log(`Successfully replied to comment ${context.payload.comment.id} in PR #${context.payload.pull_request.number}`);
            } catch (error) {
              console.error('Error replying to PR review comment:', error);
              // If replying fails, we might not want the whole workflow to fail,
              // as the issue was still created. Log it, but don't necessarily `throw error;`
              // unless you consider this a critical failure.
              core.warning(`Failed to reply to PR comment, but issue #${result.issue_number} was created: ${error.message}`);
            }
