name: Get versions

on:
  workflow_call:
    secrets:
      token:
        required: true
    outputs:
      TAGGED_VERSION:
        description: "Determine version that being tagged on this release"
        value: ${{ jobs.get-versions.outputs.TAGGED_VERSION }}

jobs:
  get-versions:
    runs-on: ${{ vars.RUNNER }}
    name: Get versions
    permissions:
      contents: read
    outputs:
      TAGGED_VERSION: ${{ steps.id_versions.outputs.TAGGED_VERSION }}
    steps:
      - name: Checkout geoips repo default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ vars.GEOIPS_ORGANIZATION }}/geoips
          ref: ${{ vars.GEOIPS_DEFAULT_BRANCH }}
          token: ${{ secrets.token }}
          path: geoips_repo_default_branch

      - name: Checkout current plugin current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.token }}
          path: current_repo_current_branch

      - name: Identify versions from GeoIPS default branch
        id: id_versions
        run: |
          version_path=./current_repo_current_branch/.github/versions
          # If the current repo does not have a .github/versions folder, then
          # use the one from the geoips repo. This allows specifying versions separately
          # for different repositories.
          if [[ ! -d $version_path ]]; then
            echo "Pulling versions out of GeoIPS repo version files"
            version_path=./geoips_repo_default_branch/.github/versions
          fi
          echo "Using version directory $version_path"

          if [[ -f ${version_path}/tagged_version ]]; then
            # Drop spaces, CR and blank lines; a file with more than one version line
            # keeps its newline and fails the check below. Not echoed before
            # validation: printing untrusted text could inject workflow commands.
            tagged_version=$(tr -d ' \t\r' < "${version_path}/tagged_version" | grep -v '^$' || true)
          else
            tagged_version=latest
          fi

          # This file may come from a pull request (including from a fork), and the
          # value is used in shell scripts and written to GITHUB_ENV/GITHUB_OUTPUT
          # by other jobs: accept only a single plain version string.
          if ! [[ "${tagged_version}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::tagged_version must be a single version string made of letters, digits, '.', '_' or '-'"
            exit 1
          fi

          echo "TAGGED_VERSION=${tagged_version}"
          echo "TAGGED_VERSION=${tagged_version}" >> "$GITHUB_ENV"
          echo "TAGGED_VERSION=${tagged_version}" >> "$GITHUB_OUTPUT"
