name: Reusable Testing CI (Docker-based and selfhostable!)

on:
  workflow_call:
    inputs:
      geoips_image:
        description: "Pre-built GeoIPS Docker image for plugin repos"
        required: false
        type: string
        default: "ghcr.io/nrlmmd-geoips/geoips:latest"
      run_core_tests:
        description: "Also run core GeoIPS unit tests"
        required: false
        type: boolean
        default: false
      pip_editable:
        description: "Enable editable pip install mode"
        required: false
        type: boolean
        default: true
      continue_on_core_unit_error:
        description: "Ignore errors in core GeoIPS unit tests"
        required: false
        type: boolean
        default: false
      continue_on_plugins_unit_error:
        description: "Ignore failues in plugin packages unit tests"
        required: false
        type: boolean
        default: false
      continue_on_core_integ_error:
        description: "Ignore errors in core GeoIPS integration tests"
        required: false
        type: boolean
        default: false
      continue_on_plugins_integ_error:
        description: "Ignore failues in plugin packages integration tests"
        required: false
        type: boolean
        default: false
      fork_approval_environment:
        description: >
          GitHub Environment (with required reviewers) that must approve a run
          before pull requests from forks may execute on the self-hosted runner
        required: false
        type: string
        default: "fork-approval"
    secrets:
      token:
        required: false
      docker_token:
        required: false
      private_repos_token:
        description: >
          Read-only GitHub token for the private plugin repos (private_plugin_repos
          and private_fortran_repos in geoips' ansible inventory). If set, the core
          image is built with those plugins and is then never pushed.
        required: false

# ---------------------------------------------------------------------------
# Example caller (in geoips or plugin repo):
#
#   name: CI
#   on:
#     pull_request:
#     workflow_dispatch:
#   concurrency:
#     group: ci-${{ github.ref }}
#     cancel-in-progress: true
#   jobs:
#     ci:
#       uses: NRLMMD-GEOIPS/geoips_ci/.github/workflows/reusable-ci.yaml@main
#       secrets:
#         token: ${{ secrets.GITHUB_TOKEN }}
#         docker_token: ${{ secrets.DOCKER_TOKEN }}
#
# Plugin repos can also pass:
#       with:
#         geoips_image: "ghcr.io/nrlmmd-geoips/geoips:latest"
#         run_core_tests: true
# ---------------------------------------------------------------------------

# REQUIRED org variables:
#   RUNNER — Docker-capable runner label (self-hosted recommended)
#
# OPTIONAL org variables:
#   DOCKER_BUILD_TARGET — Dockerfile stage to build (default: geoips-site)
#   TESTDATA_PATH       — host path for test data (default: ~/.geoips-testdata)
#   EXTRA_PLUGINS       — comma-separated extra plugin repos
#   CI_LINT             — set to "false" to skip linting
#   CI_INTEGRATION      — set to "false" to skip integration tests
#   CI_DOCKER_USER      — container user for integration (default: root)
#   ENABLE_DOCKER_REGISTRY — set to "true" to push image to registry
#   DOCKER_REGISTRY     — registry URL for push
#   DOCKER_REGISTRY_USER — registry username
#   CLEAN_STALE_TESTDATA — set to "true" to auto-delete test data dirs >30 days old
#   CI_MIN_FREE_GB      — free disk space (GB) below which stale CI images are removed (default: 40)
#   CI_PYTEST_WORKERS   — pytest-xdist workers for unit and integration tests (default: 16,
#                         0 or 1 runs them serially)
#   CI_SHM_SIZE         — /dev/shm size of the test containers (default: 16g)
#   CI_MIN_FREE_OUTPUT_GB — free space (GB) needed for test outputs in RUNNER_TEMP, or the
#                         run fails before testing (default: 150)
#
# FORK PULL REQUESTS:
#   For pull_request events whose head repo differs from this repo, the CI job
#   waits (see reusable-fork-gate.yaml) on the GitHub Environment named by
#   `fork_approval_environment` (default "fork-approval"). Create that
#   environment in the calling repo (Settings -> Environments) and add an
#   organization team as "Required reviewers". Until a reviewer approves, no
#   self-hosted job (build, lint, unit, full integration) starts. Approved fork
#   runs get a clean checkout, no secrets, and never push images or caches.
#   NOTE: a fork can edit an in-repo caller workflow and drop this gate. Also
#   enable "Require approval for all external contributors" in the repository
#   or organization Actions settings, see reusable-fork-gate.yaml.

defaults:
  run:
    shell: bash

jobs:
  # Fork pull requests wait here for approval by a required reviewer, see
  # reusable-fork-gate.yaml. Nothing below may run on the self-hosted runner
  # unless needs.fork-gate.outputs.allowed == 'true'.
  fork-gate:
    name: Fork approval gate
    uses: NRLMMD-GEOIPS/geoips_ci/.github/workflows/reusable-fork-gate.yaml@run-all-the-tests
    with:
      environment: ${{ inputs.fork_approval_environment }}

  ci:
    needs: [fork-gate]
    if: ${{ needs.fork-gate.outputs.allowed == 'true' }}
    runs-on:  self-hosted  #${{ vars.RUNNER }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      # Unique per run: concurrent runs of the same commit must not share (and
      # remove) each other's image.
      IMAGE_TAG: geoips:dev-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Every container this job starts carries geoips-ci=true (for the prune
      # script) and this run's label (to remove this run's orphans on cancel).
      CI_RUN_LABEL: geoips-ci.run=${{ github.run_id }}-${{ github.run_attempt }}
      CURR_REPO: ${{ github.event.repository.name }}
      IS_PLUGIN: ${{ github.event.repository.name != 'geoips' }}
      CI_DEBUG_FAST: false
      IS_FORK: ${{ needs.fork-gate.outputs.is_fork }}
    steps:
      - name: Remove workspace left by a fork run
        # An approved fork run executes pull request code with this workspace
        # mounted (including .git). A fork run marks the workspace before any of
        # its code runs and wipes it at the end; if that cleanup did not happen,
        # the next run wipes it here before running git in it.
        run: |
          mark_dir="${HOME}/.cache/geoips-ci"
          mark="${mark_dir}/fork-used-$(printf '%s' "${GITHUB_WORKSPACE}" | cksum | cut -d' ' -f1)"
          mkdir -p "${mark_dir}"
          if [ -e "${mark}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            echo "Workspace was used by a fork pull request run: removing its contents"
            docker run --rm --label geoips-ci=true --label "$CI_RUN_LABEL" \
              -v "${GITHUB_WORKSPACE}":/workspace alpine:latest \
              sh -c 'rm -rf /workspace/* /workspace/.[!.]* /workspace/..?*'
          fi
          rm -f "${mark}"
          if [ "${IS_FORK}" = "true" ]; then touch "${mark}"; fi

      - name: Fix workspace permissions from previous runs
        run: |
          WS="${GITHUB_WORKSPACE}"
          if [ -n "${WS}" ] && [ -d "${WS}" ]; then
            docker run --rm --label geoips-ci=true --label "$CI_RUN_LABEL" \
              -v "${WS}":/workspace \
              alpine:latest \
              sh -c "chown -R $(id -u):$(id -g) /workspace" || true
          fi
          # Test outputs of a run whose "Remove test outputs" step did not run (for
          # example, the runner died). Written as root, so removed from a container.
          if [ -d "${RUNNER_TEMP}/geoips-outdirs" ]; then
            docker run --rm --label geoips-ci=true --label "$CI_RUN_LABEL" \
              -v "${RUNNER_TEMP}":/runner_temp alpine:latest \
              rm -rf /runner_temp/geoips-outdirs || true
          fi

      - name: Clear old reports and check disk space
        env:
          MIN_FREE_GB: ${{ vars.CI_MIN_FREE_GB || '40' }}
          MIN_FREE_OUTPUT_GB: ${{ vars.CI_MIN_FREE_OUTPUT_GB || '150' }}
          CI_INTEGRATION: ${{ vars.CI_INTEGRATION }}
        run: |
          rm -rf test-reports .coverage* 2>/dev/null || true
          # Lowest free space (GB) of the filesystems we can read: the Docker root
          # directory is often not readable by the runner user, so also check the
          # workspace.
          DOCKER_ROOT=$(docker info -f '{{.DockerRootDir}}' 2>/dev/null || true)
          free_gb=""
          for path in "${DOCKER_ROOT}" "${GITHUB_WORKSPACE}" /tmp; do
            [ -n "${path}" ] || continue
            v=$(df -P -BG "${path}" 2>/dev/null | awk 'NR==2{gsub("G","",$4); print $4}') || true
            [ -n "${v}" ] || continue
            echo "Free space on ${path}: ${v}GB"
            if [ -z "${free_gb}" ] || [ "${v}" -lt "${free_gb}" ]; then free_gb="${v}"; fi
          done
          echo "Lowest free space: ${free_gb:-unknown}GB (minimum ${MIN_FREE_GB}GB)"
          if [ -n "${free_gb}" ] && [ "${free_gb}" -lt "${MIN_FREE_GB}" ]; then
            echo "::warning::Low disk space (${free_gb}GB); removing stale CI images older than 24h"
            # The daemon is shared with other users: only images whose ONLY tag is a
            # CI tag (geoips:dev-<commit sha>[-<run>-<attempt>]) from an earlier run,
            # aged by their last tag time, and never one a container uses (no -f).
            # scripts/runner-prune.sh in geoips_ci does the full cleanup.
            now=$(date +%s)
            ci_tag_re='^geoips:dev-[0-9a-f]{40}(-[0-9]+-[0-9]+)?$'
            for ref in $(docker images --filter "reference=geoips:dev-*" --format '{{.Repository}}:{{.Tag}}'); do
              [[ "$ref" =~ $ci_tag_re ]] || continue
              # Created is RFC 3339; LastTagTime.Unix is epoch seconds (a time.Time
              # printed directly would contain spaces).
              info=$(docker image inspect --format '{{.Created}} {{.Metadata.LastTagTime.Unix}} {{len .RepoTags}}' "$ref") || continue
              read -r created tagged ntags <<< "$info"
              [ -n "$created" ] || continue
              t1=$(date -d "$created" +%s 2>/dev/null) || continue
              case "$tagged" in ''|*[!0-9-]*) tagged=0 ;; esac
              [ "$tagged" -gt "$t1" ] && t1=$tagged
              if [ "$ntags" = "1" ] && [ $((now - t1)) -gt 86400 ]; then
                echo "Removing stale CI image ${ref}"
                docker rmi "$ref" || true
              fi
            done
            { echo "### Low disk space"; echo "Free was ${free_gb}GB; removed stale geoips:dev-* CI images older than 24h."; } >> "$GITHUB_STEP_SUMMARY"
          fi
          docker system df || true
          # Test outputs (each pytest-xdist worker with its own geolocation cache) go to
          # RUNNER_TEMP, about 100GB for geoips and all plugins: stop now rather than
          # fail tests halfway with a full disk.
          if [ "${CI_INTEGRATION}" != "false" ]; then
            out_gb=$(df -P -BG "${RUNNER_TEMP}" | awk 'NR==2{gsub("G","",$4); print $4}')
            echo "Free space for test outputs (${RUNNER_TEMP}): ${out_gb}GB (minimum ${MIN_FREE_OUTPUT_GB}GB)"
            if [ "${out_gb}" -lt "${MIN_FREE_OUTPUT_GB}" ]; then
              echo "::error::Only ${out_gb}GB free for test outputs in ${RUNNER_TEMP}, ${MIN_FREE_OUTPUT_GB}GB needed (CI_MIN_FREE_OUTPUT_GB)"
              exit 1
            fi
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The workspace (including .git) is copied into the image and mounted into
          # test containers: do not leave the job token in .git/config.
          persist-credentials: false
          # Fork runs remove untracked files left by earlier runs. Trusted runs keep
          # the workspace as before (clean: false).
          clean: ${{ env.IS_FORK == 'true' }}

      - name: Detect package name
        run: |
          PACKAGE_NAME=$(grep -m1 '^name\s*=' pyproject.toml | sed 's/^name\s*=\s*["'"'"']\([^"'"'"']*\)["'"'"'].*/\1/')
          if [ -z "$PACKAGE_NAME" ]; then
            echo "::error::Could not detect package name from pyproject.toml"
            exit 1
          fi
          # pyproject.toml comes from the pull request (possibly a fork), and this
          # value is reused in shell commands below: accept only a plain name.
          case "$PACKAGE_NAME" in
            *[!A-Za-z0-9_.-]*)
              echo "::error::Unsupported characters in package name from pyproject.toml"
              exit 1
              ;;
          esac
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "$GITHUB_ENV"
          echo "Detected package: ${PACKAGE_NAME}"

      - name: Set pytest-xdist workers and /dev/shm size
        env:
          PYTEST_WORKERS: ${{ vars.CI_PYTEST_WORKERS || '16' }}
          SHM_SIZE: ${{ vars.CI_SHM_SIZE || '16g' }}
        run: |
          case "$PYTEST_WORKERS" in
            ''|*[!0-9]*)
              echo "::error::CI_PYTEST_WORKERS must be a whole number"
              exit 1
              ;;
          esac
          # Multiprocessing in the tests (shared memory arenas, semaphores) uses
          # /dev/shm, 64MB by default in Docker: 16 workers reached 8.6GB. Only the
          # memory actually used is taken from RAM.
          if ! [[ "$SHM_SIZE" =~ ^[0-9]+[bkmg]?$ ]]; then
            echo "::error::CI_SHM_SIZE must be a size like 16g"
            exit 1
          fi
          echo "SHM_SIZE=${SHM_SIZE}" >> "$GITHUB_ENV"
          # Passed to the unit and integration test pytest calls (not lint). Each
          # plugin's tests run in parallel; the plugins themselves run one by one.
          if [ "$PYTEST_WORKERS" -gt 1 ]; then
            echo "XDIST_ARGS=-n ${PYTEST_WORKERS} --dist worksteal" >> "$GITHUB_ENV"
          else
            echo "XDIST_ARGS=" >> "$GITHUB_ENV"
          fi

      - name: Restore pytest cache
        uses: actions/cache/restore@v4
        with:
          path: .pytest_cache
          key: pytest-cache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            pytest-cache-${{ github.ref }}-

      - name: Log in to GHCR (build cache)
        if: ${{ env.IS_PLUGIN != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

      - name: Build deps cache layer
        if: ${{ env.IS_PLUGIN != 'true' }}
        env:
          EXTRA_PLUGINS: ${{ vars.EXTRA_PLUGINS || '' }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          # Image references must be lowercase, but github.repository keeps the
          # owner's case (NRLMMD-GEOIPS/geoips), which Docker rejects.
          remote="ghcr.io/${GH_REPOSITORY,,}:build-cache-$(uname -m)"
          old_id=$(docker image inspect -f '{{.Id}}' geoips:cache 2>/dev/null || true)
          # Cache sources: BuildKit's own cache on this runner, the local geoips:cache,
          # and the copy pushed to GHCR. BUILDKIT_INLINE_CACHE writes the cache
          # metadata into the image, without which an image cannot serve as
          # --cache-from; BuildKit then fetches only the layers it reuses, so the
          # registry image is never pulled as a whole. Missing sources only warn.
          DOCKER_BUILDKIT=1 docker build \
            --cache-from geoips:cache \
            --cache-from "$remote" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --target deps \
            --tag geoips:cache \
            --build-arg EXTRA_PLUGINS="$EXTRA_PLUGINS" \
            --build-arg GEOIPS_MODIFIED_BRANCH="${GITHUB_HEAD_REF}" \
            --progress=plain \
            .
          # Remove the previous cache image if this build left it untagged: it cannot
          # be identified as ours later. docker rmi without -f keeps it if a container
          # uses it.
          new_id=$(docker image inspect -f '{{.Id}}' geoips:cache 2>/dev/null || true)
          if [ -n "${old_id}" ] && [ "${old_id}" != "${new_id}" ] \
              && [ "$(docker image inspect -f '{{len .RepoTags}}' "${old_id}" 2>/dev/null)" = "0" ]; then
            docker rmi "${old_id}" 2>/dev/null || true
          fi

      - name: Build target image
        if: ${{ env.IS_PLUGIN != 'true' }}
        env:
          DOCKER_BUILD_TARGET: ${{ vars.DOCKER_BUILD_TARGET || 'geoips-site' }}
          EXTRA_PLUGINS: ${{ vars.EXTRA_PLUGINS || '' }}
          PIP_EDITABLE: ${{ inputs.pip_editable }}
          # Empty for fork pull requests: GitHub does not pass them secrets.
          PRIVATE_REPOS_TOKEN: ${{ secrets.private_repos_token }}
        run: |
          if ! [[ "$DOCKER_BUILD_TARGET" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Invalid DOCKER_BUILD_TARGET: $DOCKER_BUILD_TARGET" >&2
            exit 1
          fi
          # Private plugin repos: the token reaches the build only as a BuildKit
          # secret (never a build argument), so it is in no layer, no image history
          # and no .git/config (see geoips tests/ansible/scripts/github-token-env.sh).
          private_args=()
          if [ -n "$PRIVATE_REPOS_TOKEN" ] && [ "$IS_FORK" != "true" ]; then
            token_file="${RUNNER_TEMP}/geoips_private_token"
            trap 'rm -f "$token_file"' EXIT
            (umask 077 && printf '%s' "$PRIVATE_REPOS_TOKEN" > "$token_file")
            private_args=(--secret "id=geoips_private_token,src=${token_file}"
                          --build-arg GEOIPS_USE_PRIVATE_PLUGINS=true)
            echo "PRIVATE_PLUGINS_IN_IMAGE=true" >> "$GITHUB_ENV"
            echo "::notice::Building with the private plugin repos; this image will not be pushed."
          fi
          DOCKER_BUILDKIT=1 docker build \
            --cache-from geoips:cache \
            --target "$DOCKER_BUILD_TARGET" \
            --tag "$IMAGE_TAG" \
            --build-arg EXTRA_PLUGINS="$EXTRA_PLUGINS" \
            --build-arg GEOIPS_MODIFIED_BRANCH="${GITHUB_HEAD_REF}" \
            --build-arg PIP_EDITABLE="$PIP_EDITABLE" \
            "${private_args[@]}" \
            --progress=plain \
            .

      - name: Push build cache to GHCR
        if: ${{ env.IS_PLUGIN != 'true' && env.IS_FORK != 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          # Lowercase: see "Build deps cache layer".
          remote="ghcr.io/${GH_REPOSITORY,,}:build-cache-$(uname -m)"
          old_id=$(docker image inspect -f '{{.Id}}' "$remote" 2>/dev/null || true)
          docker tag geoips:cache "$remote"
          docker push "$remote"
          # Moving the tag may leave the previous image untagged: remove it unless a
          # container uses it.
          if [ -n "$old_id" ] && [ "$(docker image inspect -f '{{len .RepoTags}}' "$old_id" 2>/dev/null)" = "0" ]; then
            docker rmi "$old_id" 2>/dev/null || true
          fi

      - name: Pull base image (plugin repos)
        if: ${{ env.IS_PLUGIN == 'true' }}
        env:
          BASE_IMAGE: ${{ inputs.geoips_image || 'ghcr.io/nrlmmd-geoips/geoips:latest' }}
        run: |
          old_id=$(docker image inspect -f '{{.Id}}' "$BASE_IMAGE" 2>/dev/null || true)
          docker pull "$BASE_IMAGE"
          docker tag "$BASE_IMAGE" "$IMAGE_TAG"
          # If the pull moved the tag, the image it pointed to may now be untagged:
          # remove it unless a container uses it (no -f). Tagged images are kept.
          if [ -n "$old_id" ] && [ "$(docker image inspect -f '{{len .RepoTags}}' "$old_id" 2>/dev/null)" = "0" ]; then
            docker rmi "$old_id" 2>/dev/null || true
          fi

      - name: Smoke test
        id: smoke
        run: |
          docker run --rm --label geoips-ci=true --label "$CI_RUN_LABEL" "$IMAGE_TAG" python3 -c "import geoips; print(geoips.__version__)"

      - name: Smoke test plugin
        if: ${{ env.IS_PLUGIN == 'true' }}
        env:
          PACKAGE_NAME_ENV: ${{ env.PACKAGE_NAME }}
        run: |
          docker run --rm --label geoips-ci=true --label "$CI_RUN_LABEL" --user root \
            -v "$(pwd)":/workspace -w /workspace \
            -e PACKAGE_NAME_ENV="$PACKAGE_NAME_ENV" \
            "$IMAGE_TAG" \
            bash -c "pip install -e . && python3 -c 'import importlib, os; importlib.import_module(os.environ[\"PACKAGE_NAME_ENV\"]); print(\"OK\")'"

      - name: Lint and unit tests
        id: lint
        continue-on-error: ${{ inputs.continue_on_core_unit_error }}
        env:
          CI_LINT: ${{ vars.CI_LINT }}
          PACKAGE_NAME_ENV: ${{ env.PACKAGE_NAME }}
        run: |
          docker run --rm --label geoips-ci=true --label "$CI_RUN_LABEL" \
            --shm-size "$SHM_SIZE" \
            --user root \
            -v "$(pwd)":/workspace -w /workspace \
            -e CI_LINT -e CI_DEBUG_FAST -e PACKAGE_NAME_ENV -e CURR_REPO -e XDIST_ARGS \
            "$IMAGE_TAG" \
            bash -c '
              git config --global --add safe.directory /workspace
              pip install -e ".[test,lint]" pytest-html pytest-xdist
              create_plugin_registries
              mkdir -p /workspace/test-reports
              rc=0
              # run_suite <suite> <pytest args...>: records the result for the test
              # summary, and makes this step fail if any suite failed.
              run_suite() {
                local suite="$1" result=PASSED; shift
                echo "::group::$suite"
                pytest "$@" || { result=FAILED; rc=1; }
                echo "| $CURR_REPO | $suite | $result |" >> /workspace/test-reports/core-summary.md
                echo "::endgroup::"
              }
              if [ "$CI_LINT" = "false" ]; then
                echo "Lint disabled via CI_LINT=false"
              else
                run_suite lint -vv --tb=short -m "lint and not doc8" \
                  /packages/geoips/tests/lint/ --lint-path /workspace
              fi
              if [ "$CI_DEBUG_FAST" = "true" ]; then
                echo "Unit tests skipped (CI_DEBUG_FAST)"
              elif [ ! -d tests/unit_tests ]; then
                echo "No unit tests found, skipping"
              else
                run_suite unit -vv $XDIST_ARGS tests/unit_tests \
                  --html=/workspace/test-reports/unit-tests.html \
                  --self-contained-html \
                  --cov="$PACKAGE_NAME_ENV" \
                  --cov-report=html:/workspace/test-reports/coverage-unit
              fi
              exit $rc
            '

      - name: Core unit tests (plugin repos)
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' && env.CI_DEBUG_FAST != 'true' && env.IS_PLUGIN == 'true' && inputs.run_core_tests }}
        continue-on-error: ${{ inputs.continue_on_plugins_unit_error }}
        run: |
          docker run --rm --label geoips-ci=true --label "$CI_RUN_LABEL" \
            --shm-size "$SHM_SIZE" \
            --user root \
            -v "$(pwd)":/workspace -w /workspace \
            -e XDIST_ARGS \
            "$IMAGE_TAG" \
            bash -c '
              git config --global --add safe.directory /workspace
              pip install -e ".[test]" pytest-html pytest-xdist
              create_plugin_registries
              mkdir -p /workspace/test-reports
              result=PASSED
              pytest -vv $XDIST_ARGS /packages/geoips/tests/unit_tests \
                --html=/workspace/test-reports/core-unit-tests.html \
                --self-contained-html || result=FAILED
              echo "| geoips | unit | $result |" >> /workspace/test-reports/core-summary.md
              [ "$result" = PASSED ]
            '

      - name: Drop symlinks from test reports
        if: always()
        # Written by test code inside containers: do not let artifact uploads follow
        # a symlink to a file on the runner.
        run: |
          if [ -d test-reports ]; then find test-reports -type l -print -delete; fi

      - name: Upload core unit test report
        if: ${{ env.IS_PLUGIN == 'true' && inputs.run_core_tests && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: core-unit-test-report
          path: test-reports/core-unit-tests.html
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: test-reports/unit-tests.html
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unit test coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: test-reports/coverage-unit/
          if-no-files-found: warn
          retention-days: 14

      # -------------------------------------------------------------------
      # Test data + integration (skipped when CI_INTEGRATION == 'false')
      # -------------------------------------------------------------------

      # The test data steps below run even if core lint/unit tests failed (the plugin
      # tests still use the data), but only when the image works and never after a
      # cancel. Every test step runs even if an earlier one failed, so that a run shows
      # all failing tests; the job still fails if any of them failed.
      - name: Set testdata path
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' && vars.CI_INTEGRATION != 'false' }}
        env:
          INPUT_TESTDATA_PATH: ${{ vars.TESTDATA_PATH }}
        run: |
          TESTDATA_PATH="${INPUT_TESTDATA_PATH}"
          if [ -z "${TESTDATA_PATH}" ]; then
            TESTDATA_PATH="${HOME}/.geoips-testdata"
          fi
          TESTDATA_PATH="$(printf '%s' "${TESTDATA_PATH}" | tr -d '\r\n')"
          case "${TESTDATA_PATH}" in
            ""|*[!A-Za-z0-9/_.-]*)
              echo "Invalid TESTDATA_PATH: contains disallowed characters"
              exit 1
              ;;
          esac
          printf 'TESTDATA_PATH=%s\n' "${TESTDATA_PATH}" >> "$GITHUB_ENV"
          # /tmp/geoips_outdirs was the default before; it is never deleted automatically
          # because another repository may still use it through its own TESTDATA_PATH.
          if [ "${TESTDATA_PATH}" != "/tmp/geoips_outdirs" ] && [ -d /tmp/geoips_outdirs ]; then
            echo "::warning::/tmp/geoips_outdirs (the old default TESTDATA_PATH) still exists but this run uses ${TESTDATA_PATH}. If no CI uses it any more, delete it to free /tmp."
          fi

      - name: Ensure testdata directory exists on host
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' && vars.CI_INTEGRATION != 'false' }}
        run: |
          mkdir -p "${TESTDATA_PATH}" || sudo mkdir -p "${TESTDATA_PATH}"
          chmod a+w "${TESTDATA_PATH}"

      - name: Clean stale test data
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' && vars.CI_INTEGRATION != 'false' && vars.CLEAN_STALE_TESTDATA == 'true' }}
        run: |
          echo "CLEAN_STALE_TESTDATA=true — removing test data dirs >30 days old"
          cleaned=$(find "${TESTDATA_PATH}" -maxdepth 1 -type d -name 'test_data_*' -mtime +30 -print -exec rm -rf {} \;)
          if [ -n "$cleaned" ]; then
            echo "$cleaned"
            echo "These will be re-downloaded fresh in the next step."
          else
            echo "No stale directories to clean."
          fi

      - name: Download test datasets via ansible
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' && vars.CI_INTEGRATION != 'false' }}
        env:
          DOCKER_BUILD_TARGET: ${{ vars.DOCKER_BUILD_TARGET }}
        run: |
          BUILD_TARGET="${DOCKER_BUILD_TARGET:-geoips-site}"
          case "$BUILD_TARGET" in
            geoips-base) TAGS="base" ;;
            geoips-full) TAGS="base,full" ;;
            geoips-site) TAGS="base,full,site" ;;
            *)           TAGS="base,full" ;;
          esac

          echo "Downloading test data for tags: ${TAGS}"
          echo "Testdata path: ${TESTDATA_PATH}"

          RUNNER_UID=$(id -u)
          RUNNER_GID=$(id -g)

          docker run --rm --label geoips-ci=true --label "$CI_RUN_LABEL" \
            --user root \
            -v "${TESTDATA_PATH}:/geoips_testdata" \
            -e GEOIPS_TESTDATA_DIR=/geoips_testdata \
            "$IMAGE_TAG" \
            bash -c "
              cd /packages/geoips/tests/ansible
              ansible-playbook playbooks/test_data.yml \
                --tags ${TAGS} \
                -e geoips_testdata_dir=/geoips_testdata \
                -v
              chown -R ${RUNNER_UID}:${RUNNER_GID} /geoips_testdata
            "

      - name: Check test data
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' && vars.CI_INTEGRATION != 'false' }}
        run: |
          echo "Test data: $(du -sh "${TESTDATA_PATH}" 2>/dev/null || echo 'empty')"
          stale=$(find "${TESTDATA_PATH}" -maxdepth 1 -type d -name 'test_data_*' -mtime +30 2>/dev/null)
          if [ -n "$stale" ]; then
            echo ""
            echo "=== WARNING: Stale test data (>30 days old) ==="
            echo "  Set CLEAN_STALE_TESTDATA=true org var to auto-clean."
            echo "$stale" | while read -r d; do
              mtime=$(stat -c %Y "$d" 2>/dev/null || stat -f %m "$d" 2>/dev/null)
              [ -n "$mtime" ] && age=$(( ($(date +%s) - mtime) / 86400 )) && echo "  $d  (~${age}d old)"
            done
            echo "  stale count: $(echo "$stale" | wc -l | tr -d ' ')"
          else
            echo "All test data directories fresh (< 30 days)."
          fi

      - name: Run integration tests
        id: integ
        # Also after core lint/unit failures, see "Set testdata path".
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' && env.TESTDATA_PATH != '' && vars.CI_INTEGRATION != 'false' }}
        continue-on-error: ${{ inputs.continue_on_core_integ_error }}
        env:
          CI_DOCKER_USER: ${{ vars.CI_DOCKER_USER }}
          PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
        run: |
          if ! ls tests/integration_tests/test_*.py >/dev/null 2>&1; then
            echo "No integration tests found, skipping"
            exit 0
          fi
          DOCKER_USER="${CI_DOCKER_USER:-root}"
          if ! printf '%s' "$DOCKER_USER" | grep -Eq '^[A-Za-z0-9_.:-]+$'; then
            echo "Invalid CI_DOCKER_USER value"
            exit 1
          fi
          # Test outputs go to the runner's disk, not Docker's: each pytest-xdist worker
          # has its own GEOIPS_OUTDIRS, including its own geolocation cache (GBs).
          # Removed in "Remove test outputs".
          outdirs="${RUNNER_TEMP}/geoips-outdirs/core"
          mkdir -p "$outdirs" && chmod a+rwx "$outdirs"
          docker run --rm --label geoips-ci=true --label "$CI_RUN_LABEL" \
            --shm-size "$SHM_SIZE" \
            --user "$DOCKER_USER" \
            -v "${TESTDATA_PATH}":/geoips_testdata \
            -v "$outdirs":/output \
            -v "$(pwd)":/workspace -w /workspace \
            -e GEOIPS_TESTDATA_DIR=/geoips_testdata \
            -e CI_DEBUG_FAST -e PACKAGE_NAME -e CURR_REPO -e XDIST_ARGS \
            "$IMAGE_TAG" \
            bash -c '
              git config --global --add safe.directory /workspace
              pip install -e ".[test]" pytest-html pytest-xdist
              create_plugin_registries
              mkdir -p /workspace/test-reports
              rc=0
              # run_suite <suite> <pytest args...>: see "Lint and unit tests".
              run_suite() {
                local suite="$1" result=PASSED; shift
                echo "::group::$suite"
                pytest "$@" || { result=FAILED; rc=1; }
                echo "| $CURR_REPO | $suite | $result |" >> /workspace/test-reports/core-summary.md
                echo "::endgroup::"
              }
              run_suite integration-base -vv --tb=short $XDIST_ARGS -m "base and integration" \
                tests/integration_tests/test_*.py \
                --no-fail-on-missing-data \
                --html=/workspace/test-reports/integration-base.html \
                --self-contained-html \
                --cov="$PACKAGE_NAME" \
                --cov-report=html:/workspace/test-reports/coverage-integration-base
              if [ "$CI_DEBUG_FAST" = "true" ]; then
                echo "=== Skipping full integration: CI_DEBUG_FAST=true ==="
              else
                base_ram_gb=$(awk "/MemTotal/{printf \"%.0f\", \$2/1024/1024}" /proc/meminfo)
                if [ "$base_ram_gb" -lt 17 ]; then
                  echo "=== Skipping full integration: ${base_ram_gb}GB RAM (need >= 17GB) ==="
                else
                  run_suite integration-full -vv --tb=short $XDIST_ARGS -m "full and integration" \
                    tests/integration_tests/test_*.py \
                    --no-fail-on-missing-data \
                    --html=/workspace/test-reports/integration-full.html \
                    --self-contained-html \
                    --cov="$PACKAGE_NAME" \
                    --cov-report=html:/workspace/test-reports/coverage-integration-full
                fi
              fi
              exit $rc
            '

      - name: Run plugin tests (unit, lint, integration)
        # Also after core test failures, but not after a cancel (always() would start
        # this long step even then), and only with a working image and test data.
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' && env.TESTDATA_PATH != '' && env.IS_PLUGIN != 'true' && vars.CI_INTEGRATION != 'false' }}
        # No step-level continue-on-error: the script itself ignores unit/lint
        # failures if continue_on_plugins_unit_error and integration failures if
        # continue_on_plugins_integ_error, and fails the step otherwise.
        env:
          CI_DOCKER_USER: ${{ vars.CI_DOCKER_USER }}
          CI_LINT: ${{ vars.CI_LINT }}
          CONTINUE_PLUGINS_UNIT_ERROR: ${{ inputs.continue_on_plugins_unit_error }}
          CONTINUE_PLUGINS_INTEG_ERROR: ${{ inputs.continue_on_plugins_integ_error }}
          # Logs and artifacts of public repositories are public: private plugins'
          # tests then run without tracebacks, source lines or HTML reports.
          PRIVATE_PLUGIN_OUTPUT: ${{ (github.event.repository.visibility == 'public' && vars.SHOW_PRIVATE_PLUGIN_OUTPUT != 'true') && 'quiet' || 'full' }}
        run: |
          : "${TESTDATA_PATH:?TESTDATA_PATH is not set: the Set testdata path step did not run}"
          mkdir -p test-reports
          # See "Run integration tests".
          outdirs="${RUNNER_TEMP}/geoips-outdirs/plugins"
          mkdir -p "$outdirs" && chmod a+rwx "$outdirs"
          docker run --rm --label geoips-ci=true --label "$CI_RUN_LABEL" \
            --shm-size "$SHM_SIZE" \
            --user "${CI_DOCKER_USER:-root}" \
            -v "${TESTDATA_PATH}":/geoips_testdata \
            -v "$outdirs":/output \
            -v "$(pwd)":/workspace \
            -e GEOIPS_TESTDATA_DIR=/geoips_testdata \
            -e CI_DEBUG_FAST \
            -e CI_LINT \
            -e CONTINUE_PLUGINS_UNIT_ERROR \
            -e CONTINUE_PLUGINS_INTEG_ERROR \
            -e PRIVATE_PLUGIN_OUTPUT \
            -e XDIST_ARGS \
            "$IMAGE_TAG" \
            bash -c '
              echo "::group::Scan /packages/"
              ls -la /packages/
              echo "::endgroup::"
              echo ""
              failed=""
              ignored=""
              found_count=0
              skip_count=0
              summary="/workspace/test-reports/plugin-summary.md"
              pip install pytest-html pytest-xdist --quiet
              # Written by the image build when it included private plugin repos.
              private_plugins=" $(tr "\n" " " < /packages/.private_plugins 2>/dev/null) "
              quiet=false
              out_args="-vv --tb=short"
              # html_args <report file>: HTML report options, none for quiet plugins
              html_args() { [ "$quiet" = true ] || echo "--html=/workspace/test-reports/$1 --self-contained-html"; }
              echo "| Plugin | Suite | Result |" > "$summary"
              echo "|---|---|---|" >> "$summary"

              # run_suite <plugin> <suite> <ignore-failure: true|false> <pytest args...>
              run_suite() {
                local name="$1" suite="$2" ignore="$3"; shift 3
                echo "::group::$name/$suite"
                if pytest $out_args "$@"; then
                  echo "$name/$suite: PASSED"
                  echo "| $name | $suite | PASSED |" >> "$summary"
                elif [ "$ignore" = "true" ]; then
                  echo "$name/$suite: FAILED (ignored)"
                  echo "| $name | $suite | FAILED (ignored) |" >> "$summary"
                  ignored="$ignored $name/$suite"
                else
                  echo "$name/$suite: FAILED"
                  echo "| $name | $suite | FAILED |" >> "$summary"
                  failed="$failed $name/$suite"
                fi
                echo "::endgroup::"
              }

              for pkg_dir in /packages/*/; do
                name=$(basename "$pkg_dir")
                [ "$name" = "geoips" ] && continue
                cd "$pkg_dir"
                quiet=false; out_args="-vv --tb=short"
                case "$private_plugins" in
                  *" $name "*)
                    if [ "$PRIVATE_PLUGIN_OUTPUT" = "quiet" ]; then
                      quiet=true; out_args="-qq --tb=no -rN"
                      echo "$name is a private plugin: only results are shown in this public repository (SHOW_PRIVATE_PLUGIN_OUTPUT=true shows everything)"
                    fi ;;
                esac
                # Lint every plugin (it only reads the files, no install needed).
                if [ "$CI_LINT" != "false" ] && [ "$CI_DEBUG_FAST" != "true" ]; then
                  run_suite "$name" lint "$CONTINUE_PLUGINS_UNIT_ERROR" -m "lint and not doc8" \
                    /packages/geoips/tests/lint/ --lint-path "$pkg_dir"
                fi
                has_integ=false; has_unit=false; has_unit_long=false
                ls "$pkg_dir"tests/integration_tests/test_*.py >/dev/null 2>&1 && has_integ=true
                [ -d "$pkg_dir/tests/unit_tests" ] && has_unit=true
                [ -d "$pkg_dir/tests/unit_tests_long" ] && has_unit_long=true
                if [ "$has_integ" = false ] && [ "$has_unit" = false ] && [ "$has_unit_long" = false ]; then
                  echo "NO TESTS $name: no unit or integration tests (lint only)"
                  echo "| $name | tests | NO TESTS |" >> "$summary"
                  skip_count=$((skip_count + 1))
                  continue
                fi
                found_count=$((found_count + 1))
                echo "::group::Install $name"
                pip install -e ".[test]" --quiet || pip install -e . --quiet
                create_plugin_registries
                echo "::endgroup::"

                if [ "$CI_DEBUG_FAST" != "true" ]; then
                  if [ "$has_unit" = true ]; then
                    run_suite "$name" unit "$CONTINUE_PLUGINS_UNIT_ERROR" $XDIST_ARGS tests/unit_tests \
                      $(html_args "$name-unit-tests.html")
                  fi
                  if [ "$has_unit_long" = true ]; then
                    run_suite "$name" unit-long "$CONTINUE_PLUGINS_UNIT_ERROR" $XDIST_ARGS tests/unit_tests_long \
                      $(html_args "$name-unit-tests-long.html")
                  fi
                fi
                if [ "$has_integ" = true ]; then
                  run_suite "$name" integration-base "$CONTINUE_PLUGINS_INTEG_ERROR" $XDIST_ARGS -m "base and integration" \
                    tests/integration_tests/test_*.py --no-fail-on-missing-data \
                    $(html_args "$name-integration-base.html")
                  if [ "$CI_DEBUG_FAST" = "true" ]; then
                    echo "$name/integration-full: SKIPPED (CI_DEBUG_FAST)"
                  else
                    run_suite "$name" integration-full "$CONTINUE_PLUGINS_INTEG_ERROR" $XDIST_ARGS -m "full and integration" \
                      tests/integration_tests/test_*.py --no-fail-on-missing-data \
                      $(html_args "$name-integration-full.html")
                  fi
                fi
              done
              echo ""
              echo "::group::Summary"
              echo "Plugin repos with tests:           $found_count"
              echo "Plugin repos without tests:        $skip_count"
              [ -n "$ignored" ] && echo "IGNORED FAILURES:$ignored"
              if [ -n "$failed" ]; then
                echo "FAILURES:$failed"
                echo "::endgroup::"
                exit 1
              fi
              if [ -n "$ignored" ]; then
                echo "No blocking plugin failures (some failures were ignored, see above)"
              else
                echo "All plugin tests PASSED"
              fi
              echo "::endgroup::"
            '

      - name: Drop symlinks from test reports (integration)
        if: always()
        # Written by test code inside containers: do not let artifact uploads follow
        # a symlink to a file on the runner.
        run: |
          if [ -d test-reports ]; then find test-reports -type l -print -delete; fi

      - name: Upload integration test reports
        if: ${{ vars.CI_INTEGRATION != 'false' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          path: |
            test-reports/integration-base.html
            test-reports/integration-full.html
            test-reports/*-integration-base.html
            test-reports/*-integration-full.html
            test-reports/*-unit-tests*.html
            test-reports/plugin-summary.md
            test-reports/coverage-integration-base/
            test-reports/coverage-integration-full/
          if-no-files-found: warn
          retention-days: 14

      # -------------------------------------------------------------------
      # Optional: push image to registry
      # -------------------------------------------------------------------

      - name: Push image to registry
        # An image with private plugins is only pushed if the registry is known to be
        # private: set ALLOW_PRIVATE_IMAGE_PUSH=true.
        if: ${{ vars.ENABLE_DOCKER_REGISTRY == 'true' && env.IS_PLUGIN != 'true' && env.IS_FORK != 'true' && (env.PRIVATE_PLUGINS_IN_IMAGE != 'true' || vars.ALLOW_PRIVATE_IMAGE_PUSH == 'true') }}
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
          DOCKER_REGISTRY_USER: ${{ vars.DOCKER_REGISTRY_USER }}
        run: |
          echo "${DOCKER_TOKEN}" | docker login "$DOCKER_REGISTRY" \
            -u "$DOCKER_REGISTRY_USER" --password-stdin

          # Repository path components must be lowercase (the login name need not be).
          REMOTE_TAG="${DOCKER_REGISTRY}/${DOCKER_REGISTRY_USER,,}/geoips:dev-${GITHUB_SHA}"
          docker tag "$IMAGE_TAG" "$REMOTE_TAG"
          docker push "$REMOTE_TAG"

      - name: Push dev image to GHCR (core only, on merge to main)
        # Never with private plugins: plugin repos pull this image (it must stay public).
        if: ${{ env.IS_PLUGIN != 'true' && env.IS_FORK != 'true' && env.PRIVATE_PLUGINS_IN_IMAGE != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "${GITHUB_TOKEN}" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin
          # Lowercase: github.repository keeps the owner's case, Docker rejects it.
          REMOTE_TAG="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          old_id=$(docker image inspect -f '{{.Id}}' "$REMOTE_TAG" 2>/dev/null || true)
          docker tag "$IMAGE_TAG" "$REMOTE_TAG"
          docker push "$REMOTE_TAG"
          # Moving the tag may leave the previous image untagged: remove it unless a
          # container uses it.
          if [ -n "$old_id" ] && [ "$(docker image inspect -f '{{len .RepoTags}}' "$old_id" 2>/dev/null)" = "0" ]; then
            docker rmi "$old_id" 2>/dev/null || true
          fi

      - name: Test summary
        if: always()
        env:
          CORE_FAILED: ${{ steps.smoke.outcome != 'success' || steps.lint.outcome == 'failure' || steps.integ.outcome == 'failure' }}
        run: |
          # Both files are written by test code inside containers: never follow a symlink.
          # Rows: | <repo> | <suite> | PASSED, FAILED, FAILED (ignored) or NO TESTS |
          reports=()
          for f in test-reports/core-summary.md test-reports/plugin-summary.md; do
            if [ -f "$f" ] && [ ! -L "$f" ]; then reports+=("$f"); fi
          done
          # One line per repository, this repository first. A repository whose steps
          # failed before any suite recorded a result is reported as not run.
          emoji=$(awk -F'|' -v core="$CURR_REPO" -v core_failed="$CORE_FAILED" '
            function trim(s) { gsub(/^[ \t]+|[ \t]+$/, "", s); return s }
            {
              name = trim($2); suite = trim($3); res = trim($4)
              if (name == "" || name == "Plugin" || name ~ /^-+$/) next
              if (!(name in seen)) { seen[name] = 1; order[++n] = name }
              if (res == "FAILED") fail[name] = fail[name] " " suite
              else if (res == "FAILED (ignored)") ign[name] = ign[name] " " suite
              else if (res == "PASSED") pass[name] = 1
            }
            END {
              if (!(core in seen))
                print (core_failed == "true" ? "❌ " core " (tests did not run)" : "➖ " core " (no tests run)")
              for (i = 1; i <= n; i++) {
                p = order[i]
                if (p in fail) {
                  line = "❌ " p " (failed:" fail[p]
                  if (p in ign) line = line "; ignored:" ign[p]
                  print line ")"
                }
                else if (p in ign) print "⚠️ " p " (failed, ignored:" ign[p] ")"
                else if (p in pass) print "✅ " p
                else print "➖ " p " (no tests)"
              }
            }' "${reports[@]}" /dev/null)
          echo "$emoji"
          {
            echo "## Test results"
            echo ""
            while IFS= read -r line; do echo "- $line"; done <<< "$emoji"
            if [ -f test-reports/plugin-summary.md ] && [ ! -L test-reports/plugin-summary.md ]; then
              echo ""
              echo "### Plugin test results"
              cat test-reports/plugin-summary.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # -------------------------------------------------------------------
      # Cleanup
      # -------------------------------------------------------------------

      - name: Stop this run's containers
        if: always()
        run: |
          # A cancelled or timed-out step kills the docker client, not the container.
          # Stop this run's containers first so nothing still writes to the workspace
          # while it is chowned and cached below.
          for c in $(docker ps -aq --filter "label=${CI_RUN_LABEL}"); do
            docker rm -f "$c" || true
          done

      - name: Remove test outputs
        if: always()
        run: |
          # Written by test containers, possibly as root: remove them from a container.
          if [ -d "${RUNNER_TEMP}/geoips-outdirs" ]; then
            docker run --rm --label geoips-ci=true --label "$CI_RUN_LABEL" \
              -v "${RUNNER_TEMP}":/runner_temp alpine:latest \
              rm -rf /runner_temp/geoips-outdirs || true
          fi

      - name: Fix workspace permissions for next run
        if: always()
        run: |
          WS="${GITHUB_WORKSPACE}"
          if [ -n "${WS}" ] && [ -d "${WS}" ]; then
            docker run --rm --label geoips-ci=true --label "$CI_RUN_LABEL" \
              -v "${WS}":/workspace \
              alpine:latest \
              sh -c "chown -R $(id -u):$(id -g) /workspace" || true
          fi

      - name: Save pytest cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .pytest_cache
          key: pytest-cache-${{ github.ref }}-${{ github.sha }}

      - name: Remove this run's CI images
        if: always()
        run: |
          # Only this run's tag and stopped labelled containers: the daemon is shared,
          # so never a system/builder prune. For plugin repos this only removes the tag.
          docker rmi "$IMAGE_TAG" 2>/dev/null || true
          docker container prune -f --filter label=geoips-ci=true || true

      - name: Remove fork workspace
        if: ${{ always() && env.IS_FORK == 'true' }}
        run: |
          # Fork code ran with this workspace mounted: do not leave anything (hooks,
          # .git/config, untracked files) for later jobs of this repository.
          docker run --rm --label geoips-ci=true --label "$CI_RUN_LABEL" \
            -v "${GITHUB_WORKSPACE}":/workspace alpine:latest \
            sh -c 'rm -rf /workspace/* /workspace/.[!.]* /workspace/..?*' || true
          rm -f "${HOME}/.cache/geoips-ci/fork-used-$(printf '%s' "${GITHUB_WORKSPACE}" | cksum | cut -d' ' -f1)"
