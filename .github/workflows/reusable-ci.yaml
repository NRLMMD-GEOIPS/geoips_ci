name: Reusable Testing CI (Docker-based and selfhostable!)

on:
  workflow_call:
    inputs:
      geoips_image:
        description: "Pre-built GeoIPS Docker image for plugin repos"
        required: false
        type: string
        default: "ghcr.io/nrlmmd-geoips/geoips:latest"
      run_core_tests:
        description: "Also run core GeoIPS unit tests"
        required: false
        type: boolean
        default: false
      editable_pip_install:
        description: "Enable editable pip install mode"
        required: false
        type: boolean
        default: true
    secrets:
      token:
        required: false
      docker_token:
        required: false

# ---------------------------------------------------------------------------
# Example caller (in geoips or plugin repo):
#
#   name: CI
#   on:
#     pull_request:
#     workflow_dispatch:
#   concurrency:
#     group: ci-${{ github.ref }}
#     cancel-in-progress: true
#   jobs:
#     ci:
#       uses: NRLMMD-GEOIPS/geoips_ci/.github/workflows/reusable-ci.yaml@main
#       secrets:
#         token: ${{ secrets.GITHUB_TOKEN }}
#         docker_token: ${{ secrets.DOCKER_TOKEN }}
#
# Plugin repos can also pass:
#       with:
#         geoips_image: "ghcr.io/nrlmmd-geoips/geoips:latest"
#         run_core_tests: true
# ---------------------------------------------------------------------------

# REQUIRED org variables:
#   RUNNER — Docker-capable runner label (self-hosted recommended)
#
# OPTIONAL org variables:
#   DOCKER_BUILD_TARGET — Dockerfile stage to build (default: geoips-site)
#   TESTDATA_PATH       — host path for test data (default: ../.geoips-testdata)
#   EXTRA_PLUGINS       — comma-separated extra plugin repos
#   CI_LINT             — set to "false" to skip linting
#   CI_INTEGRATION      — set to "false" to skip integration tests
#   CI_DOCKER_USER      — container user for integration (default: root)
#   ENABLE_DOCKER_REGISTRY — set to "true" to push image to registry
#   DOCKER_REGISTRY     — registry URL for push
#   DOCKER_REGISTRY_USER — registry username
#   CLEAN_STALE_TESTDATA — set to "true" to auto-delete test data dirs >30 days old

defaults:
  run:
    shell: bash

jobs:
  ci:
    runs-on:  self-hosted  #${{ vars.RUNNER }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: geoips:dev-${{ github.sha }}
      CURR_REPO: ${{ github.event.repository.name }}
      IS_PLUGIN: ${{ github.event.repository.name != 'geoips' }}
      CI_DEBUG_FAST: false
    steps:
      - name: Fix workspace permissions from previous runs
        run: |
          WS="${GITHUB_WORKSPACE}"
          if [ -n "${WS}" ] && [ -d "${WS}" ]; then
            docker run --rm \
              -v "${WS}":/workspace \
              alpine:latest \
              sh -c "chown -R $(id -u):$(id -g) /workspace" || true
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Detect package name
        run: |
          PACKAGE_NAME=$(grep -m1 '^name\s*=' pyproject.toml | sed 's/^name\s*=\s*["'"'"']\([^"'"'"']*\)["'"'"'].*/\1/')
          if [ -z "$PACKAGE_NAME" ]; then
            echo "::error::Could not detect package name from pyproject.toml"
            exit 1
          fi
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> $GITHUB_ENV
          echo "Detected package: ${PACKAGE_NAME}"

      - name: Restore pytest cache
        uses: actions/cache@v4
        with:
          path: .pytest_cache
          key: pytest-cache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            pytest-cache-${{ github.ref }}-
          save-always: true

      - name: Pull build cache (deps layers from previous run)
        if: ${{ env.IS_PLUGIN != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker pull ghcr.io/$GH_REPOSITORY:build-cache-$(uname -m) || true
          docker tag ghcr.io/$GH_REPOSITORY:build-cache-$(uname -m) geoips:cache 2>/dev/null || true

      - name: Build deps cache layer
        if: ${{ env.IS_PLUGIN != 'true' }}
        env:
          EXTRA_PLUGINS: ${{ vars.EXTRA_PLUGINS || '' }}
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --cache-from geoips:cache \
            --target deps \
            --tag geoips:cache \
            --build-arg EXTRA_PLUGINS="$EXTRA_PLUGINS" \
            --build-arg GEOIPS_MODIFIED_BRANCH="${GITHUB_HEAD_REF}" \
            --progress=plain \
            .

      - name: Build target image
        if: ${{ env.IS_PLUGIN != 'true' }}
        env:
          DOCKER_BUILD_TARGET: ${{ vars.DOCKER_BUILD_TARGET || 'geoips-site' }}
          EXTRA_PLUGINS: ${{ vars.EXTRA_PLUGINS || '' }}
          EDITABLE_PIP_INSTALL: ${{ inputs.editable_pip_install }}
        run: |
          if ! [[ "$DOCKER_BUILD_TARGET" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Invalid DOCKER_BUILD_TARGET: $DOCKER_BUILD_TARGET" >&2
            exit 1
          fi
          DOCKER_BUILDKIT=1 docker build \
            --cache-from geoips:cache \
            --target "$DOCKER_BUILD_TARGET" \
            --tag $IMAGE_TAG \
            --build-arg EXTRA_PLUGINS="$EXTRA_PLUGINS" \
            --build-arg GEOIPS_MODIFIED_BRANCH="${GITHUB_HEAD_REF}" \
            --build-arg EDITABLE_PIP_INSTALL="$EDITABLE_PIP_INSTALL" \
            --progress=plain \
            .

      - name: Push build cache to GHCR
        if: ${{ env.IS_PLUGIN != 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          docker tag geoips:cache "ghcr.io/$GH_REPOSITORY:build-cache-$(uname -m)"
          docker push "ghcr.io/$GH_REPOSITORY:build-cache-$(uname -m)"

      - name: Pull base image (plugin repos)
        if: ${{ env.IS_PLUGIN == 'true' }}
        env:
          BASE_IMAGE: ${{ inputs.geoips_image || 'ghcr.io/nrlmmd-geoips/geoips:latest' }}
        run: |
          docker pull "$BASE_IMAGE"
          docker tag "$BASE_IMAGE" "$IMAGE_TAG"

      - name: Smoke test
        run: |
          docker run --rm $IMAGE_TAG python3 -c "import geoips; print(geoips.__version__)"

      - name: Smoke test plugin
        if: ${{ env.IS_PLUGIN == 'true' }}
        env:
          PACKAGE_NAME_ENV: ${{ env.PACKAGE_NAME }}
        run: |
          docker run --rm --user root \
            -v $(pwd):/workspace -w /workspace \
            -e PACKAGE_NAME_ENV="$PACKAGE_NAME_ENV" \
            $IMAGE_TAG \
            bash -c "pip install -e . && python3 -c 'import importlib, os; importlib.import_module(os.environ[\"PACKAGE_NAME_ENV\"]); print(\"OK\")'"

      - name: Lint and unit tests
        id: lint
        env:
          CI_LINT: ${{ vars.CI_LINT }}
          PACKAGE_NAME_ENV: ${{ env.PACKAGE_NAME }}
        run: |
          if [ "$CI_LINT" = "false" ]; then
            echo "Lint disabled via CI_LINT=false"
            LINT_CMD="echo Lint skipped"
          else
            LINT_CMD="pytest -vv --tb=short -m 'lint and not doc8' /packages/geoips/tests/lint/ --lint-path /workspace"
          fi

          if [ "$CI_DEBUG_FAST" = "true" ]; then
            UNIT_CMD="echo 'Unit tests skipped (CI_DEBUG_FAST)'"
            UPLOAD_UNIT=false
          elif [ ! -d "tests/unit_tests" ]; then
            UNIT_CMD="echo 'No unit tests found, skipping'"
            UPLOAD_UNIT=false
          else
            UNIT_CMD="pytest -vv tests/unit_tests \
              --html=/workspace/test-reports/unit-tests.html \
              --self-contained-html \
              --cov=\"$PACKAGE_NAME_ENV\" \
              --cov-report=html:/workspace/test-reports/coverage-unit"
            UPLOAD_UNIT=true
          fi

          docker run --rm \
            --user root \
            -v $(pwd):/workspace -w /workspace \
            $IMAGE_TAG \
            bash -c "
              git config --global --add safe.directory /workspace
              pip install -e '.[test,lint]' pytest-html
              create_plugin_registries
              echo '::group::Lint'
              ${LINT_CMD}
              echo '::endgroup::'
              echo '---'
              echo '::group::Unit tests'
              ${UNIT_CMD}
              echo '::endgroup::'
            "

          echo "UPLOAD_UNIT=${UPLOAD_UNIT:-false}" >> $GITHUB_ENV

      - name: Core unit tests (plugin repos)
        if: ${{ env.CI_DEBUG_FAST != 'true' && env.IS_PLUGIN == 'true' && inputs.run_core_tests }}
        run: |
          docker run --rm \
            --user root \
            -v $(pwd):/workspace -w /workspace \
            $IMAGE_TAG \
            bash -c "
              git config --global --add safe.directory /workspace
              pip install -e '.[test]' pytest-html
              create_plugin_registries
              pytest -vv /packages/geoips/tests/unit_tests \
                --html=/workspace/test-reports/core-unit-tests.html \
                --self-contained-html
            "

      - name: Upload core unit test report
        if: ${{ env.IS_PLUGIN == 'true' && inputs.run_core_tests && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: core-unit-test-report
          path: test-reports/core-unit-tests.html
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: test-reports/unit-tests.html
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unit test coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: test-reports/coverage-unit/
          if-no-files-found: warn
          retention-days: 14

      # -------------------------------------------------------------------
      # Test data + integration (skipped when CI_INTEGRATION == 'false')
      # -------------------------------------------------------------------

      - name: Set testdata path
        if: ${{ vars.CI_INTEGRATION != 'false' }}
        env:
          INPUT_TESTDATA_PATH: ${{ vars.TESTDATA_PATH }}
        run: |
          TESTDATA_PATH="${INPUT_TESTDATA_PATH}"
          if [ -z "${TESTDATA_PATH}" ]; then
            TESTDATA_PATH="/tmp/geoips_outdirs"
          fi
          TESTDATA_PATH="$(printf '%s' "${TESTDATA_PATH}" | tr -d '\r\n')"
          case "${TESTDATA_PATH}" in
            ""|*[!A-Za-z0-9/_\.\-]*)
              echo "Invalid TESTDATA_PATH: contains disallowed characters"
              exit 1
              ;;
          esac
          printf 'TESTDATA_PATH=%s\n' "${TESTDATA_PATH}" >> "$GITHUB_ENV"

      - name: Ensure testdata directory exists on host
        if: ${{ vars.CI_INTEGRATION != 'false' }}
        run: |
          mkdir -p "${TESTDATA_PATH}" || sudo mkdir -p "${TESTDATA_PATH}"
          chmod a+w "${TESTDATA_PATH}"

      - name: Clean stale test data
        if: ${{ vars.CI_INTEGRATION != 'false' && vars.CLEAN_STALE_TESTDATA == 'true' }}
        run: |
          echo "CLEAN_STALE_TESTDATA=true — removing test data dirs >30 days old"
          cleaned=$(find "${TESTDATA_PATH}" -maxdepth 1 -type d -name 'test_data_*' -mtime +30 -print -exec rm -rf {} \;)
          if [ -n "$cleaned" ]; then
            echo "$cleaned"
            echo "These will be re-downloaded fresh in the next step."
          else
            echo "No stale directories to clean."
          fi

      - name: Download test datasets via ansible
        if: ${{ vars.CI_INTEGRATION != 'false' }}
        env:
          DOCKER_BUILD_TARGET: ${{ vars.DOCKER_BUILD_TARGET }}
        run: |
          BUILD_TARGET="${DOCKER_BUILD_TARGET:-geoips-site}"
          case "$BUILD_TARGET" in
            geoips-base) TAGS="base" ;;
            geoips-full) TAGS="base,full" ;;
            geoips-site) TAGS="base,full,site" ;;
            *)           TAGS="base,full" ;;
          esac

          echo "Downloading test data for tags: ${TAGS}"
          echo "Testdata path: ${TESTDATA_PATH}"

          RUNNER_UID=$(id -u)
          RUNNER_GID=$(id -g)

          docker run --rm \
            --user root \
            -v "${TESTDATA_PATH}:/geoips_testdata" \
            -e GEOIPS_TESTDATA_DIR=/geoips_testdata \
            $IMAGE_TAG \
            bash -c "
              cd /packages/geoips/tests/ansible
              ansible-playbook playbooks/test_data.yml \
                --tags ${TAGS} \
                -e geoips_testdata_dir=/geoips_testdata \
                -v
              chown -R ${RUNNER_UID}:${RUNNER_GID} /geoips_testdata
            "

      - name: Check test data
        if: ${{ vars.CI_INTEGRATION != 'false' }}
        run: |
          echo "Test data: $(du -sh ${TESTDATA_PATH} 2>/dev/null || echo 'empty')"
          stale=$(find "${TESTDATA_PATH}" -maxdepth 1 -type d -name 'test_data_*' -mtime +30 2>/dev/null)
          if [ -n "$stale" ]; then
            echo ""
            echo "=== WARNING: Stale test data (>30 days old) ==="
            echo "  Set CLEAN_STALE_TESTDATA=true org var to auto-clean."
            echo "$stale" | while read -r d; do
              mtime=$(stat -c %Y "$d" 2>/dev/null || stat -f %m "$d" 2>/dev/null)
              [ -n "$mtime" ] && age=$(( ($(date +%s) - mtime) / 86400 )) && echo "  $d  (~${age}d old)"
            done
            echo "  stale count: $(echo "$stale" | wc -l | tr -d ' ')"
          else
            echo "All test data directories fresh (< 30 days)."
          fi

      - name: Run integration tests
        if: ${{ vars.CI_INTEGRATION != 'false' }}
        env:
          CI_DOCKER_USER: ${{ vars.CI_DOCKER_USER }}
          PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
        run: |
          if ! ls tests/integration_tests/test_*.py >/dev/null 2>&1; then
            echo "No integration tests found, skipping"
            exit 0
          fi
          DOCKER_USER="${CI_DOCKER_USER:-root}"
          if ! printf '%s' "$DOCKER_USER" | grep -Eq '^[A-Za-z0-9_.:-]+$'; then
            echo "Invalid CI_DOCKER_USER value"
            exit 1
          fi
          docker run --rm \
            --user "$DOCKER_USER" \
            -v ${TESTDATA_PATH}:/geoips_testdata \
            -v $(pwd):/workspace -w /workspace \
            -e GEOIPS_TESTDATA_DIR=/geoips_testdata \
            -e CI_DEBUG_FAST \
            $IMAGE_TAG \
            bash -c "
              git config --global --add safe.directory /workspace
              pip install -e '.[test]' pytest-html
              create_plugin_registries
              echo '::group::Base integration'
              pytest -vv --tb=short -m 'base and integration' \
                tests/integration_tests/test_*.py \
                --no-fail-on-missing-data \
                --html=/workspace/test-reports/integration-base.html \
                --self-contained-html \
                --cov=\"$PACKAGE_NAME\" \
                --cov-report=html:/workspace/test-reports/coverage-integration-base
              echo '::endgroup::'
              if [ \"$CI_DEBUG_FAST\" = \"true\" ]; then
                echo \"=== Skipping full integration: CI_DEBUG_FAST=true ===\"
              else
                base_ram_gb=\$(awk '/MemTotal/{printf \"%.0f\", \$2/1024/1024}' /proc/meminfo)
                if [ \$base_ram_gb -lt 17 ]; then
                  echo \"=== Skipping full integration: \${base_ram_gb}GB RAM (need >= 17GB) ===\"
                else
                  echo '::group::Full integration'
                  pytest -vv --tb=short -m 'full and integration' \
                    tests/integration_tests/test_*.py \
                    --no-fail-on-missing-data \
                    --html=/workspace/test-reports/integration-full.html \
                    --self-contained-html \
                    --cov=\"$PACKAGE_NAME\" \
                    --cov-report=html:/workspace/test-reports/coverage-integration-full
                  echo '::endgroup::'
                fi
              fi
            "

      - name: Run plugin integration tests
        if: ${{ always() && env.IS_PLUGIN != 'true' && vars.CI_INTEGRATION != 'false' }}
        env:
          CI_DOCKER_USER: ${{ vars.CI_DOCKER_USER }}
        run: |
          docker run --rm \
            --user ${CI_DOCKER_USER:-root} \
            -v ${TESTDATA_PATH}:/geoips_testdata \
            -v $(pwd):/workspace \
            -e GEOIPS_TESTDATA_DIR=/geoips_testdata \
            -e CI_DEBUG_FAST \
            $IMAGE_TAG \
            bash -c '
              echo "::group::Scan /packages/"
              ls -la /packages/
              echo "::endgroup::"
              echo ""
              failed=""
              found_count=0
              skip_count=0
              for pkg_dir in /packages/*/; do
                name=$(basename "$pkg_dir")
                [ "$name" = "geoips" ] && continue
                if ! ls "$pkg_dir/tests/integration_tests/test_"*.py >/dev/null 2>&1; then
                  echo "SKIP $name: no test_*.py in tests/integration_tests/"
                  skip_count=$((skip_count + 1))
                  continue
                fi
                found_count=$((found_count + 1))
                echo "::group::$name"
                echo "FOUND $name plugin repo with integration tests"
                cd "$pkg_dir"
                pip install -e . --quiet
                create_plugin_registries
                echo "::group::Base integration"
                if pytest -vv --tb=short -m "base and integration" \
                  tests/integration_tests/test_*.py \
                  --no-fail-on-missing-data \
                  --html="/workspace/test-reports/$name-integration-base.html" \
                  --self-contained-html; then
                  echo "$name/base: PASSED"
                else
                  echo "$name/base: FAILED"
                  failed="$failed $name/base"
                fi
                echo "::endgroup::"
                if [ "$CI_DEBUG_FAST" = "true" ]; then
                  echo "$name/full: SKIPPED (CI_DEBUG_FAST)"
                else
                  echo "::group::Full integration"
                  if pytest -vv --tb=short -m "full and integration" \
                    tests/integration_tests/test_*.py \
                    --no-fail-on-missing-data \
                    --html="/workspace/test-reports/$name-integration-full.html" \
                    --self-contained-html; then
                    echo "$name/full: PASSED"
                  else
                    echo "$name/full: FAILED"
                    failed="$failed $name/full"
                  fi
                  echo "::endgroup::"
                fi
                echo "::endgroup::"
              done
              echo ""
              echo "::group::Summary"
              echo "Repos found with integration tests: $found_count"
              echo "Repos skipped (no test files):     $skip_count"
              if [ -n "$failed" ]; then
                echo "FAILURES:$failed"
                echo "::endgroup::"
                exit 1
              fi
              echo "All plugin tests PASSED"
              echo "::endgroup::"
            '

      - name: Upload integration test reports
        if: ${{ vars.CI_INTEGRATION != 'false' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          path: |
            test-reports/integration-base.html
            test-reports/integration-full.html
            test-reports/*-integration-base.html
            test-reports/*-integration-full.html
            test-reports/coverage-integration-base/
            test-reports/coverage-integration-full/
          if-no-files-found: warn
          retention-days: 14

      # -------------------------------------------------------------------
      # Optional: push image to registry
      # -------------------------------------------------------------------

      - name: Push image to registry
        if: ${{ vars.ENABLE_DOCKER_REGISTRY == 'true' && env.IS_PLUGIN != 'true' }}
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
          DOCKER_REGISTRY_USER: ${{ vars.DOCKER_REGISTRY_USER }}
        run: |
          echo "${DOCKER_TOKEN}" | docker login "$DOCKER_REGISTRY" \
            -u "$DOCKER_REGISTRY_USER" --password-stdin

          REMOTE_TAG="${DOCKER_REGISTRY}/${DOCKER_REGISTRY_USER}/geoips:dev-${GITHUB_SHA}"
          docker tag $IMAGE_TAG $REMOTE_TAG
          docker push $REMOTE_TAG

      - name: Push dev image to GHCR (core only, on merge to main)
        if: ${{ env.IS_PLUGIN != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "${GITHUB_TOKEN}" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin
          REMOTE_TAG="ghcr.io/${GITHUB_REPOSITORY}:latest"
          docker tag $IMAGE_TAG $REMOTE_TAG
          docker push $REMOTE_TAG

      # -------------------------------------------------------------------
      # Cleanup
      # -------------------------------------------------------------------

      - name: Fix workspace permissions for next run
        if: always()
        run: |
          WS="${GITHUB_WORKSPACE}"
          if [ -n "${WS}" ] && [ -d "${WS}" ]; then
            docker run --rm \
              -v "${WS}":/workspace \
              alpine:latest \
              sh -c "chown -R $(id -u):$(id -g) /workspace" || true
          fi
