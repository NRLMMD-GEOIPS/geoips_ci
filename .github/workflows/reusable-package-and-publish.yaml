name: Package/publish

# 1. Tag and Release - on PR merge of v*-version-release
#    * Tag current version
#    * Release just tagged version
# 2. Package and Publish - on published release (from #1)
#    * Build wheel
#    * Publish to pypi

on:
  workflow_call:
    secrets:
      token:
        required: true
      pypi_user:
        required: false
      pypi_password:
        required: false

# Assuming this is in the plugin repo's workflow file.
# on:
#   # triggers the workflow on published release
#   releases:
#     types:
#       - published
#   # allows run of this workflow manually from the actions tab
#   # must be merged to default before it will be available to manually run.
#   workflow_dispatch:

jobs:
  print-variables:
    name: Print variables
    uses: NRLMMD-GEOIPS/geoips_ci/.github/workflows/reusable-print-variables.yaml@main

  package_and_publish:
    name: "Deploy to Pypi"
    runs-on: ${{ vars.RUNNER }}
    permissions:
      contents: read
    steps:
      - name: Checkout current plugin current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.token }}

      - name: Create distributions
        shell: bash
        run: |
          python -m pip install -U build pip
          python -m build
      - name: Publish package to PyPI
        # upload to PyPI on every release for a tag starting with 'v'
        # if: github.event.action == 'published' && startsWith(github.event.release.tag_name, 'v')
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          user: ${{ secrets.pypi_user }}
          password: ${{ secrets.pypi_password }}
