name: Note edits

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# We only need to check status of release notes from pull requests.
on:
  # Triggers the workflow when pull request created and updated
  pull_request:
    # Require manually kicking off CI by opening, reopening, or removing draft status.
    # NOTE when used as a repository ruleset, these types are ignored, and
    # opened, reopened, and synchronize are explicitly always enabled.
    types: [opened, ready_for_review, reopened]
  # Allows run of this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  note-edits:
    # Only runs if the pull request is NOT a draft
    if: github.event.pull_request.draft == false
    name: Note edits
    # You do not appear to be able to use variables in the "uses" field.
    uses: NRLMMD-GEOIPS/geoips_ci/.github/workflows/reusable-proper-release-note-edits.yaml@main
    permissions:
      contents: read
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
