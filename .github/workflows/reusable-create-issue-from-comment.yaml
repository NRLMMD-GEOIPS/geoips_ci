name: Create Issue from PR Review Comment

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'The pull request number'
        required: true
        type: string
      pr_title:
        description: 'The pull request title'
        required: true
        type: string
      pr_author_login:
        description: 'The login of the PR author'
        required: true
        type: string
      pr_html_url:
        description: 'The HTML URL of the PR'
        required: true
        type: string
      comment_id:
        description: 'The ID of the review comment'
        required: true
        type: string
      comment_body:
        description: 'The body of the review comment'
        required: true
        type: string
      comment_html_url:
        description: 'The HTML URL of the comment'
        required: true
        type: string
      comment_path:
        description: 'The path of the file commented on'
        required: true
        type: string
      comment_line:
        description: 'The line number of the comment'
        required: true
        type: string 
      comment_user_login:
        description: 'The login of the comment author'
        required: true
        type: string
      comment_in_reply_to_id:
        description: 'The ID of the comment this comment is replying to (if any)'
        required: false
        type: string

permissions:
  pull-requests: write
  issues: write

jobs:
  create-issue-from-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Create issue with comment thread
        id: create-issue
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_AUTHOR_LOGIN: ${{ inputs.pr_author_login }}
          PR_HTML_URL: ${{ inputs.pr_html_url }}
          COMMENT_ID: ${{ inputs.comment_id }}
          COMMENT_BODY: ${{ inputs.comment_body }}
          COMMENT_HTML_URL: ${{ inputs.comment_html_url }}
          COMMENT_PATH: ${{ inputs.comment_path }}
          COMMENT_LINE: ${{ inputs.comment_line }}
          COMMENT_USER_LOGIN: ${{ inputs.comment_user_login }}
          COMMENT_IN_REPLY_TO_ID: ${{ inputs.comment_in_reply_to_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |

            // Access data from environment variables (populated from inputs)
            const prNumber = parseInt(process.env.PR_NUMBER);
            const prTitle = process.env.PR_TITLE;
            const prAuthor = process.env.PR_AUTHOR_LOGIN;
            const prHtmlUrl = process.env.PR_HTML_URL;
            const commentId = parseInt(process.env.COMMENT_ID);
            const commentBody = process.env.COMMENT_BODY;
            const commentUrl = process.env.COMMENT_HTML_URL;
            const commentPath = process.env.COMMENT_PATH;
            const commentLine = process.env.COMMENT_LINE;
            const commentUser = process.env.COMMENT_USER_LOGIN;
            const commentInReplyToId = process.env.COMMENT_IN_REPLY_TO_ID ? parseInt(process.env.COMMENT_IN_REPLY_TO_ID) : null;

            // Repo context is available directly
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (!prNumber || !commentId) {
              core.setFailed('Missing required input data (pr_number or comment_id).');
              return;
            }

            const issueTitle = `[PR #${prNumber}] ${prTitle} - Incomplete Item from comment`;

            let commentThread = '';
            try {
              const allComments = await github.paginate(github.rest.pulls.listReviewComments, {
                owner: owner,
                repo: repo,
                pull_number: prNumber
              });

              // Find the full object for the triggering comment from all fetched comments
              const currentCommentObject = allComments.find(c => c.id === commentId);

              if (!currentCommentObject) {
                core.warning(`Triggering comment with ID ${commentId} not found in PR comments. Issue will be created with minimal comment data.`);
                commentThread = '### Triggering Comment\n\n';
                commentThread += `**@${commentUser}** [commented](${commentUrl}) on \`${commentPath}\`:\n`;
                commentThread += `> ${commentBody.replace(/\n/g, '\n> ')}\n\n`;
              } else {
                let relatedComments = [];

                // Use currentCommentObject for thread logic
                if (currentCommentObject.in_reply_to_id) {
                  const originalComment = allComments.find(c => c.id === currentCommentObject.in_reply_to_id);
                  if (originalComment) {
                    relatedComments.push(originalComment);
                    relatedComments = relatedComments.concat(
                      allComments.filter(c => c.in_reply_to_id === originalComment.id)
                    );
                  }
                  if (!relatedComments.find(c => c.id === currentCommentObject.id)) {
                      relatedComments.push(currentCommentObject);
                  }
                } else {
                  if (!relatedComments.find(c => c.id === currentCommentObject.id)) {
                      relatedComments.push(currentCommentObject);
                  }
                  relatedComments = relatedComments.concat(
                    allComments.filter(c => c.in_reply_to_id === currentCommentObject.id)
                  );
                }

                relatedComments = [...new Map(relatedComments.map(c => [c.id, c])).values()]
                  .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

                if (relatedComments.length > 0) {
                  commentThread = '### Comment Thread\n\n';
                  for (const comment of relatedComments) {
                    const cmHtmlUrl = comment.html_url || `https://github.com/${owner}/${repo}/pull/${prNumber}#discussion_r${comment.id}`;
                    const cmUserLogin = comment.user?.login || 'Unknown User';
                    const cmBodyText = comment.body || 'No content';
                    commentThread += `**@${cmUserLogin}** [commented](${cmHtmlUrl}) on \`${comment.path}\`:\n`;
                    commentThread += `> ${cmBodyText.replace(/\n/g, '\n> ')}\n\n`;
                  }
                }
              }
            } catch (error) {
              core.error('Error fetching/processing comment thread: ' + error.message);
              commentThread = '### Triggering Comment\n\n';
              commentThread += `**@${commentUser}** [commented](${commentUrl}) on \`${commentPath}\`:\n`;
              commentThread += `> ${commentBody.replace(/\n/g, '\n> ')}\n\n`;
            }

            const issueBody = `
            ## Issue created from PR review comment

            This issue was automatically created from a review comment in [PR #${prNumber}](${prHtmlUrl}).

            ### Details
            - **File**: \`${commentPath}\`
            - **Line**: ${commentLine}
            - **PR Author**: @${prAuthor}
            - **Comment Author**: @${commentUser}

            ${commentThread}

            [View the original comment](${commentUrl})
            `;

            try {
              const issue = await github.rest.issues.create({
                owner: owner,
                repo: repo,
                title: issueTitle,
                body: issueBody,
                labels: ['incomplete issue'],
                assignees: [prAuthor]
              });

              console.log(`Created issue #${issue.data.number}. Full issue data: ${JSON.stringify(issue.data, null, 2)}`);

              const issueNumber = issue.data.number;
              const issueUrl = issue.data.html_url;

              core.info(`Extracted issue_number: ${issueNumber} (type: ${typeof issueNumber})`);
              core.info(`Extracted issue_url: ${issueUrl} (type: ${typeof issueUrl})`);

              const outputPayload = {
                success: true,
                issue_number: issueNumber,
                issue_url: issueUrl
              };
              const jsonStringToSet = JSON.stringify(outputPayload);

              core.info(`GITHUB_OUTPUT env var: ${process.env.GITHUB_OUTPUT}`); // Check if GITHUB_OUTPUT is set
              core.info(`JSON string to be set as output 'result': "${jsonStringToSet}"`); // Log with quotes to see if it's truly empty

              if (jsonStringToSet === undefined || jsonStringToSet === null || typeof jsonStringToSet !== 'string' || jsonStringToSet.trim() === '') {
                core.warning(`The JSON string for output is empty, null, undefined, or not a string before calling setOutput! Value: "${jsonStringToSet}", Type: ${typeof jsonStringToSet}`);
              }

              core.setOutput('result', jsonStringToSet);
              core.info("core.setOutput('result', ...) was called."); // Confirmation

              // As a fallback/test, set a simple string output too
              core.setOutput('test_output', "This is a test string output");
              core.info("core.setOutput('test_output', ...) was called.");

            } catch (error) {
              console.error('Error creating issue or setting output:', error);
              core.setFailed(`Failed to create issue or set output: ${error.message}`);
            }

      - name: Comment on PR review with issue link
        if: steps.create-issue.outcome == 'success'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_AUTHOR_LOGIN: ${{ inputs.pr_author_login }}
          COMMENT_ID: ${{ inputs.comment_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const resultJson = '${{ steps.create-issue.outputs.result }}';
            const testOutputFromPreviousStep = '${{ steps.create-issue.outputs.test_output }}';

            core.info(`Received resultJson: "${resultJson}"`); // Log with quotes
            core.info(`Received test_output: "${testOutputFromPreviousStep}"`); // Log with quotes

            if (!resultJson) {
              core.warning('Result from create-issue step is empty. Cannot comment on PR.');
              // Optionally, you can add more checks here based on test_output
              if (testOutputFromPreviousStep === "This is a test string output") {
                core.warning('However, the test_output was received correctly. Problem might be with the main "result" output content or its stringification.');
              } else {
                core.warning('The test_output was ALSO not received or empty. This suggests a more fundamental problem with outputs.');
              }
              return;
            }

            const result = JSON.parse(resultJson);

            if (!result.success || !result.issue_number || !result.issue_url) {
              // If success was false, the 'if' condition of the step should have prevented this.
              // This is a fallback or if the 'if' condition is made less strict.
              core.warning('Missing issue information or success:false in result, cannot comment on PR.');
              return;
            }

            const prNumber = parseInt(process.env.PR_NUMBER);
            const prAuthorLogin = process.env.PR_AUTHOR_LOGIN;
            const commentIdToReply = parseInt(process.env.COMMENT_ID);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              await github.rest.pulls.createReviewComment({
                owner: owner,
                repo: repo,
                pull_number: prNumber,
                body: `✅ I've created issue #${result.issue_number} to track this item and assigned it to @${prAuthorLogin}. [View the issue](${result.issue_url})`,
                in_reply_to: commentIdToReply
              });
              console.log(`Successfully replied to comment ${commentIdToReply} in PR #${prNumber}`);
            } catch (error) {
              console.error('Error replying to PR review comment:', error);
              core.warning(`Failed to reply to PR comment, but issue #${result.issue_number} was created: ${error.message}`);
            }
